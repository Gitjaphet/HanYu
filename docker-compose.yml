# Développement local : uniquement PostgreSQL (la production aura son propre fichier)
services:
  db:
    image: postgres:18-alpine
    container_name: hanyu_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hanyu
      POSTGRES_PASSWORD: hanyu
      POSTGRES_DB: hanyu
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hanyu_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanyu -d hanyu"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hanyu_pgdata:
