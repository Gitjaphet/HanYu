# Production HanYu sur le VPS (/opt/hanyu). Secrets et domaine : fichier .env à côté (jamais dans git).
name: hanyu

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hanyu
      POSTGRES_DB: hanyu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanyu -d hanyu"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/gitjaphet/hanyu-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://hanyu:${POSTGRES_PASSWORD}@db:5432/hanyu
      ENVIRONMENT: production
      CORS_ORIGINS: '["https://${DOMAIN:?DOMAIN manquant dans .env}"]'
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      BREVO_API_KEY: ${BREVO_API_KEY:?BREVO_API_KEY manquant dans .env}
      FRONTEND_URL: https://${DOMAIN}
      UVICORN_ROOT_PATH: /api
    networks:
      - internal
      - traefik_proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.routers.hanyu-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.hanyu-api.entrypoints=websecure
      - traefik.http.routers.hanyu-api.tls.certresolver=letsencrypt
      - traefik.http.routers.hanyu-api.middlewares=hanyu-api-strip
      - traefik.http.routers.hanyu-api.service=hanyu-api
      - traefik.http.middlewares.hanyu-api-strip.stripprefix.prefixes=/api
      - traefik.http.services.hanyu-api.loadbalancer.server.port=8000
      # Connexion et inscription : limite par adresse IP, appliquée par Traefik avant l'API.
      # Large (60/min) car une école connecte toute une classe depuis la même IP ;
      # la vraie protection contre la force brute est le blocage par e-mail dans l'API.
      - traefik.http.routers.hanyu-auth.rule=Host(`${DOMAIN}`) && (Path(`/api/auth/login`) || Path(`/api/auth/register`) || Path(`/api/auth/forgot-password`) || Path(`/api/auth/reset-password`))
      - traefik.http.routers.hanyu-auth.entrypoints=websecure
      - traefik.http.routers.hanyu-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.hanyu-auth.middlewares=hanyu-auth-limit,hanyu-api-strip
      - traefik.http.routers.hanyu-auth.service=hanyu-api
      - traefik.http.middlewares.hanyu-auth-limit.ratelimit.average=60
      - traefik.http.middlewares.hanyu-auth-limit.ratelimit.period=1m
      - traefik.http.middlewares.hanyu-auth-limit.ratelimit.burst=60

  web:
    image: ghcr.io/gitjaphet/hanyu-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - traefik_proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.routers.hanyu-web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.hanyu-web.entrypoints=websecure
      - traefik.http.routers.hanyu-web.tls.certresolver=letsencrypt
      - traefik.http.services.hanyu-web.loadbalancer.server.port=3000

volumes:
  pgdata:

networks:
  internal:
  traefik_proxy:
    external: true
